[project]
name = "03-order-agent"
version = "0.2.0"
description = "LangChain restaurant ordering, reservation and delivery assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1.4.0",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=1.6.1",
    "pydantic>=2.8,<3",
    "pymilvus>=3.0.1,<4",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "redis>=6.0,<8",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
