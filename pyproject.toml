[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "03-order-agent"
version = "0.1.0"
description = "六合餐厅点餐、预订与配送查询应用"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.2.3",
    "tzdata>=2024.1",
    "mcp>=1.6,<2",
    "pymilvus>=3.0.1,<4",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.2.0"]
langchain = [
    "langchain>=1.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.1",
    "pymysql>=1.2.0",
    "sentence-transformers>=6.0.1",
]

[tool.setuptools]
packages = ["restaurant_app", "agent"]
py-modules = ["main"]
